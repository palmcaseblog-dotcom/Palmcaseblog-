<!DOCTYPE html>
<html lang="en">

<head>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Palmcaseblog — trending news, entertainment, sports, politics, technology and lifestyle stories."
  >

  <meta
    name="theme-color"
    content="#111827"
  >

  <title>Palmcaseblog — Trending News & Stories</title>


  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f6f8;
      color: #111827;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width: min(1180px, 92%);
      margin: auto;
    }


    /* BREAKING BAR */

    .breaking {
      background: #111827;
      color: white;
      padding: 9px 20px;
      text-align: center;
      font-size: 14px;
    }

    .breaking strong {
      color: #f59e0b;
    }


    /* HEADER */

    .site-header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .topbar {
      min-height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      font-size: 28px;
      font-weight: 800;
      color: #111827;
    }

    .logo img {
      width: 58px;
      height: 58px;
      object-fit: cover;
      border-radius: 50%;
      margin-right: 10px;
    }

    .menu-btn {
      display: none;
      border: none;
      background: #111827;
      color: white;
      padding: 10px 13px;
      border-radius: 6px;
      font-size: 20px;
    }

    .header-search {
      display: flex;
      gap: 7px;
    }

    .header-search input {
      width: 240px;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }

    button {
      border: none;
      cursor: pointer;
      background: #111827;
      color: white;
      padding: 11px 16px;
      border-radius: 6px;
      font-weight: 600;
    }


    /* NAVIGATION */

    .nav {
      background: #111827;
      color: white;
    }

    .nav-inner {
      display: flex;
      align-items: center;
      gap: 28px;
      min-height: 50px;
      overflow-x: auto;
    }

    .nav a {
      font-size: 14px;
      white-space: nowrap;
    }

    .nav a:hover,
    .nav .active {
      color: #f59e0b;
    }


    /* HERO */

    .hero {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
      margin: 30px 0;
    }

    .hero-main,
    .mini-card {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: #111827;
      color: white;
    }

    .hero-main {
      min-height: 440px;
    }

    .hero-main img {
      width: 100%;
      height: 440px;
      object-fit: cover;
      opacity: .78;
    }

    .hero-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 35px;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,.9)
      );
    }

    .hero-overlay h1 {
      font-size: 38px;
      line-height: 1.15;
      margin: 10px 0;
    }

    .hero-overlay p {
      color: #e5e7eb;
    }

    .hero-side {
      display: grid;
      gap: 20px;
    }

    .mini-card {
      min-height: 210px;
    }

    .mini-card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
    }

    .mini-card div {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 20px;
      background: linear-gradient(
        transparent,
        rgba(0,0,0,.9)
      );
    }

    .mini-card h2 {
      font-size: 19px;
      line-height: 1.2;
      margin-top: 7px;
    }


    /* TAG */

    .tag {
      display: inline-block;
      background: #f59e0b;
      color: #111827;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 8px;
      border-radius: 4px;
    }


    /* SECTION HEAD */

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: end;
      margin: 35px 0 18px;
    }

    .section-head h2 {
      font-size: 28px;
      margin-top: 3px;
    }

    .section-head a {
      color: #d97706;
      font-weight: 700;
    }

    .eyebrow {
      font-size: 12px;
      font-weight: 800;
      color: #d97706;
      letter-spacing: 1px;
    }


    /* TRENDING */

    .trending-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
    }

    .trend-card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
    }

    .trend-card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }

    .trend-card-content {
      padding: 15px;
    }

    .trend-card h3 {
      font-size: 17px;
      line-height: 1.3;
      margin-top: 8px;
    }


    /* CONTENT */

    .content-layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
      margin-top: 40px;
    }

    .posts-grid {
      display: grid;
      gap: 18px;
    }

    .post-card {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 20px;
      background: white;
      border-radius: 10px;
      padding: 15px;
      border: 1px solid #e5e7eb;
    }

    .post-card img {
      width: 220px;
      height: 145px;
      object-fit: cover;
      border-radius: 8px;
    }

    .post-card h3 {
      font-size: 21px;
      line-height: 1.3;
      margin: 7px 0;
    }

    .post-card p {
      color: #6b7280;
      font-size: 14px;
    }


    /* SIDEBAR */

    .side-box {
      background: white;
      padding: 20px;
      border-radius: 10px;
      border: 1px solid #e5e7eb;
      margin-bottom: 20px;
    }

    .side-box h3 {
      margin-bottom: 15px;
    }

    .popular-item {
      padding: 13px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .popular-item:last-child {
      border-bottom: none;
    }

    .popular-item strong {
      display: block;
      font-size: 15px;
    }


    /* NEWSLETTER */

    .newsletter p {
      color: #6b7280;
      font-size: 14px;
      margin: 10px 0 15px;
    }

    .newsletter input {
      width: 100%;
      padding: 11px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 8px;
    }

    .newsletter button {
      width: 100%;
    }

    #subscribeMsg {
      display: block;
      margin-top: 8px;
      color: #16a34a;
    }


    /* ADMIN SECTION */

    .publisher {
      margin: 50px 0;
      background: #111827;
      color: white;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
    }

    .publisher p {
      color: #d1d5db;
      margin-top: 10px;
      max-width: 650px;
      margin-left: auto;
      margin-right: auto;
    }

    .admin-button {
      display: inline-block;
      margin-top: 20px;
      background: #f59e0b;
      color: #111827;
      padding: 12px 20px;
      border-radius: 7px;
      font-weight: 700;
    }


    /* LOADING */

    .loading {
      background: white;
      padding: 30px;
      border-radius: 10px;
      text-align: center;
      color: #6b7280;
    }


    /* FOOTER */

    footer {
      background: #0b1120;
      color: white;
      margin-top: 50px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 40px;
      padding: 45px 0;
    }

    .footer-grid h4 {
      margin-bottom: 12px;
    }

    .footer-grid a {
      display: block;
      color: #d1d5db;
      margin-bottom: 7px;
    }

    .footer-grid p {
      color: #9ca3af;
    }

    .copyright {
      text-align: center;
      padding: 18px;
      border-top: 1px solid #1f2937;
      color: #9ca3af;
      font-size: 13px;
    }


    /* MOBILE */

    @media (max-width: 800px) {

      .topbar {
        min-height: 75px;
      }

      .menu-btn {
        display: block;
      }

      .logo {
        font-size: 21px;
      }

      .logo img {
        width: 45px;
        height: 45px;
      }

      .header-search {
        display: none;
      }

      .nav-inner {
        gap: 20px;
        min-height: 45px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .hero-main {
        min-height: 360px;
      }

      .hero-main img {
        height: 360px;
      }

      .hero-overlay {
        padding: 22px;
      }

      .hero-overlay h1 {
        font-size: 28px;
      }

      .trending-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .content-layout {
        grid-template-columns: 1fr;
      }

      .post-card {
        grid-template-columns: 1fr;
      }

      .post-card img {
        width: 100%;
        height: 210px;
      }

      .footer-grid {
        grid-template-columns: 1fr;
      }

    }


    @media (max-width: 500px) {

      .trending-grid {
        grid-template-columns: 1fr;
      }

      .section-head h2 {
        font-size: 23px;
      }

      .hero-overlay h1 {
        font-size: 25px;
      }

    }

  </style>

</head>


<body>

  </div>

        <a

        <a href="#politics">

        </a>

        <a href="#sports">
          Sports
        </a>

        <a href="#technology">
          Technology
        </a>

        <a href="#lifestyle">
          Lifestyle
        </a>

      </div>

    </nav>

  </header>


  <!-- MAIN -->

  <main
