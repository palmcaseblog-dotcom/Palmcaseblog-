
name: Update Palmcaseblog Sitemap

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

concurrency:
  group: update-palmcaseblog-sitemap
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get published posts from Supabase
        env:
          SUPABASE_URL: https://kcxlwhojwdvbfjjnartw.supabase.co
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          curl -fsS \
            "${SUPABASE_URL}/rest/v1/posts?select=id,created_at,static_page_generated&status=eq.published&order=created_at.desc" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -o posts.json

      - name: Build sitemap
        run: |
          cat > sitemap.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
            <url>
              <loc>https://palmcaseblog.com.ng/</loc>
            </url>
          EOF

          jq -r '.[] |
            if .static_page_generated == true then
              "  <url><loc>https://palmcaseblog.com.ng/articles/\(.id).html</loc><lastmod>\(.created_at)</lastmod></url>"
            else
              "  <url><loc>https://palmcaseblog.com.ng/article.html?id=\(.id)</loc><lastmod>\(.created_at)</lastmod></url>"
            end
          ' posts.json >> sitemap.xml

          cat >> sitemap.xml <<'EOF'
          </urlset>
          EOF

      - name: Commit and push updated sitemap
        run: |
          git config user.name "Palmcaseblog Sitemap Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp sitemap.xml /tmp/palmcase-sitemap.xml

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main

            cp /tmp/palmcase-sitemap.xml sitemap.xml
            git add sitemap.xml

            if git diff --cached --quiet; then
              echo "Sitemap is already up to date."
              exit 0
            fi

            git commit -m "Update Palmcaseblog sitemap"

            if git push origin HEAD:main; then
              echo "Sitemap successfully pushed."
              exit 0
            fi

            echo "Push failed. Retrying with latest main branch."
          done

          echo "Failed to push sitemap after 3 attempts."
          exit 1
